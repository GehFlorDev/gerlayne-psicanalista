<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossos Contatos | Psicanálise</title>
  
  <!-- Fontes do Google (Cormorant Garamond e Montserrat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #3F554A;
      color: #FFFFFF;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
    }

    /* Ícone minimalista da Mente (Símbolo Psi em dourado) */
    .symbol-icon {
      width: 56px;
      height: 56px;
      margin-bottom: 16px;
    }

    .symbol-icon path {
      stroke: #DBA967;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 1px;
      color: #FFFFFF;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 0.85rem;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #DBA967;
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    .links-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 24px;
      background-color: transparent;
      color: #FFFFFF;
      border: 1px solid #DBA967;
      border-radius: 30px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-action:hover {
      background-color: #DBA967;
      color: #3F554A;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 300;
    }

    /* Melhores visuais e enquadramento para telas maiores (Tablets e PCs) */
    @media (min-width: 768px) {
      body {
        padding: 48px 20px;
      }

      .container {
        padding: 40px 32px;
        background-color: rgba(0, 0, 0, 0.08);
        border-radius: 20px;
        border: 1px solid rgba(219, 169, 103, 0.25);
      }

      h1 {
        font-size: 2.5rem;
      }

      .symbol-icon {
        width: 64px;
        height: 64px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Símbolo minimalista da mente (Psi) -->
    <svg class="symbol-icon" viewBox="0 0 24 24">
      <path d="M12 3v18M6 8a6 6 0 0 0 12 0M9 8c0 4 3 6 3 6s3-2 3-6" />
    </svg>

    <h1>Gerlayne Florência</h1>
    <p class="subtitle">Psicanálise & Escuta</p>

    <p class="section-title">Nossos Contatos</p>

    <div class="links-wrapper">
      <a href="https://wa.me/5511989333118" target="_blank" rel="noopener" class="btn-action">
        WhatsApp
      </a>

      <a href="https://instagram.com/gerlaynepsicanalista" target="_blank" rel="noopener" class="btn-action">
        Instagram
      </a>

      <a href="mailto:gerlayne.psicanalista@outlook.com" class="btn-action">
        E-mail
      </a>
    </div>

    <footer>
      &copy; Atendimento Online
    </footer>
  </div>

</body>
</html>
